<style>
/* Layout: pit-wall tool — slim header, tab strip, working panels; TrackSide renders as the dark one-pager the driver gets. */

}

  --hero:#2c2a28; --lane-track:#ebe8e4; --lane-fuel:#e3a54a; --lane-fluid:#7fb0e6; --lane-body:#6cc39a; --soon:#6cc39a; --soon-bg:#1f3a2c; --v2:#9cc1ee; --v2-bg:#1e2c3d; --warn-bg:#3a2c14; --warn-line:#6b5223; color-scheme:dark}}
:root[data-theme="dark"]{

  --hero:#2c2a28; --lane-track:#ebe8e4; --lane-fuel:#e3a54a; --lane-fluid:#7fb0e6; --lane-body:#6cc39a; --soon:#6cc39a; --soon-bg:#1f3a2c; --v2:#9cc1ee; --v2-bg:#1e2c3d; --warn-bg:#3a2c14; --warn-line:#6b5223; color-scheme:dark}

.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:18px 12px}

/* Event tabs grouped by moment: Before · At the track · After (Rodrigo 2026-11-11). One switch style across the app: pills */
nav.tabs{display:flex;gap:10px 18px;align-items:flex-end;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}

nav.tabs button[data-tab]{border:0;border-radius:999px;background:transparent;padding:7px 14px;min-height:34px;font:600 14px var(--f-display);color:var(--muted);white-space:nowrap}
nav.tabs button[data-tab]:hover{color:var(--ink)}

@media (max-width:760px){
  nav.tabs{gap:8px;padding-bottom:10px}

}
section.panel{padding-top:20px;display:grid;gap:20px}

.chip.run{background:var(--accent-soft);border-color:transparent;color:var(--ink)}
.chip.hot{background:var(--warn);border-color:transparent;color:var(--surface)}
.flag{color:var(--warn);font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.daytitle{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
.notice{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:13px}
/* Plan (internal) */
table.plan td.col-session{font-weight:500}
table.plan td div+div{margin-top:3px}

table.plan tr.night td{color:var(--muted)}
/* Phone: the 5 columns become one timeline: time on the left, each item on its own line with a small tag (Rodrigo 2026-11-11) */

}
@media (max-width:760px) and (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.plan td.c-meal .pi::before{background:#1f3a2a;color:#8fd3a8}:root:not([data-theme="light"]) table.plan td.c-hyd .pi::before{background:#1c3147;color:#93c2ee}:root:not([data-theme="light"]) table.plan td.c-oth .pi::before{background:#33274a;color:#c7b0ea}}
@media (max-width:760px){:root[data-theme="dark"] table.plan td.c-meal .pi::before{background:#1f3a2a;color:#8fd3a8}:root[data-theme="dark"] table.plan td.c-hyd .pi::before{background:#1c3147;color:#93c2ee}:root[data-theme="dark"] table.plan td.c-oth .pi::before{background:#33274a;color:#c7b0ea}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
/* ===== Race week engine: timetable parser + Rodrigo's timing rules ===== */
const RW = (() => {
  const toMin = t => { if (t == null || t === '') return null; const m = String(t).match(/(\d{1,2})[:hH.](\d{2})/); return m ? (+m[1]) * 60 + (+m[2]) : null; };
  const fmt = m => { if (m == null) return ''; m = ((Math.round(m) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'); };
  const floor5 = m => Math.floor(m / 5) * 5;

  const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
  const dayRe = new RegExp('\\b(' + DAYS.join('|') + ')\\b[ ,]+(' + MONTHS.join('|') + ')\\s+(\\d{1,2})(?:st|nd|rd|th)?,?\\s+(\\d{4})', 'i');
  const rowRe = /^\s*(\d{1,2}[:.]\d{2})(?:\s+(\d{1,2}[:.]\d{2}))?\s+(.*)$/;
  const NOT_WHO = '(?!(?:FIA|FP|FP1|FP2|FP3|TV|PR|VIP|GP)\\b)';
  const whoRe = new RegExp('^((?:TM|Drivers?|Eng|Mech|All|Top ?3|' + NOT_WHO + '[A-Z]{2,3})(?:\\s*[+,/&]\\s*(?:TM|Drivers?|Eng|Mech|All|Top ?3|' + NOT_WHO + '[A-Z]{2,3}))*)\\s+(.*)$');
  const whoTok = '(?:[Tt]eam|TEAM|[Dd]rivers?|DRIVERS?|[Ee]ng(?:ineers?)?|ENG|[Mm]ech(?:anics)?|MECH|[Aa]ll|ALL|[Tt]ires|[Tt]yres|TIRES|TYRES|Top ?3|' + NOT_WHO + '[A-Z]{2,3})';
  const whoEndRe = new RegExp('^' + whoTok + '(?:\\s*[+,/&]\\s*' + whoTok + ')*$');
  const dayOnlyRe = new RegExp('^\\W*(' + DAYS.join('|') + ')\\W*$', 'i');
  const isMine = (kind, who, code) => {
    if (kind === 'logistics' || kind === 'curfew') return false;
    const w = String(who || '').toUpperCase();
    if (!w) return true;
    if (/\bDRIVERS?\b|\bALL\b/.test(w) || (code && new RegExp('\\b' + code + '\\b').test(w))) return true;
    return (kind === 'lunch' || kind === 'dinner') && /\bTEAM\b/.test(w);
  };
  // Next date (YYYY-MM-DD) on or after `from` that falls on weekday name `day`.
  const nextDow = (from, day) => { const t = new Date(from + 'T12:00:00Z'); const want = (DAYS.findIndex(d => d.toLowerCase() === day.toLowerCase()) + 1) % 7; while (t.getUTCDay() !== want) t.setUTCDate(t.getUTCDate() + 1); return t.toISOString().slice(0, 10); };

  function classify(what) {
    const w = what.toLowerCase();
    if (/curfew/.test(w)) return 'curfew';
    if (/appointment|arrival (at|to) (the )?circuit/.test(w)) return 'appointment';
    if (/arrive (on|at|to) (the )?track|drivers? (to )?arrive/.test(w)) return 'appointment';
    if (/trolley|released to pit|pit ?lane open|tyres in parc|parc ferme|cars move to pit|move to pit ?lane|\d ?min(ute)? board|green flag|leave hotel|tire collection|tyre collection|scrutineering|catering access|acces?s to paddock/.test(w)) return 'logistics';
    if (/\bdinner\b/.test(w) && !/meeting|briefing|debrief/.test(w)) return 'dinner';
    if (/press|meeting|briefing|debrief|review|strategy|check ?list|analysis|sign-?on|photo|portrait|shots|roundtable|track walk|radio|jump in|tyres|trolley|pit ?lane open|released/.test(w)) return 'team';
    if (/warm ?-?up|w\.?\s?up/.test(w)) return 'warmup';
    if (/in (the )?cars?\b|\bcar\b$/.test(w)) return 'incar';
    if (/lunch/.test(w)) return 'lunch';
    if (/free practice|\bfp\s?\d?\b|practice|qualifying|\bquali\b|race|\btest\b|testing|sprint|^\s*(d\d\s?s\d|opt\s?\d|q\d|r\d)\b/.test(w)) return 'session';
    return 'team';
  }

  function sessionShort(what) {
    const w = what.toLowerCase();
    if (/free practice|practice|\bfp/.test(w)) return 'FP';
    if (/qualif|quali/.test(w)) return 'Quali';
    if (/^\s*(d\d\s?s\d|opt\s?\d)\b/.test(w)) return what.trim().split(/\s+/)[0].toUpperCase();
    if (/^\s*q\d\b/.test(w)) return 'Q' + w.trim()[1];
    if (/^\s*r\d\b/.test(w)) return 'Race ' + w.trim()[1];
    if (/sprint/.test(w)) return 'Sprint Race';
    if (/feature/.test(w)) return 'Feature Race';
    const rn = w.match(/race\s*(\d)\b/); if (rn) return 'Race ' + rn[1];
    if (/race/.test(w)) return 'Race';
    if (/test/.test(w)) return 'Test';
    return what;
  }
  const isRace = b => (/race|sprint|^\s*r\d\b/i.test(b.what)) && !/pre ?race/i.test(b.what);

  /* Parse timetable text (one line per row, columns separated by 2+ spaces where possible). */
  function parseTimetable(text, driverCode, baseDate) {
    let lastDate = baseDate || new Date().toISOString().slice(0, 10);
    const lines = String(text).split(/\r?\n/);
    const days = []; let cur = null;
    const code = (driverCode || '').trim().toUpperCase();
    for (const raw of lines) {
      const dm = raw.match(dayRe);
      if (dm) {
        const mi = MONTHS.indexOf(dm[2].toLowerCase());
        const date = dm[4] + '-' + String(mi + 1).padStart(2, '0') + '-' + String(+dm[3]).padStart(2, '0');
        lastDate = date; cur = days.find(d => d.date === date);
        if (!cur) { cur = { date, label: dm[1][0].toUpperCase() + dm[1].slice(1).toLowerCase(), blocks: [] }; days.push(cur); }
        continue;
      }
      const dn = raw.match(dayOnlyRe);
      if (dn) {
        const date = nextDow(lastDate, dn[1]); lastDate = date;
        cur = days.find(d => d.date === date);
        if (!cur) { cur = { date, label: dn[1][0].toUpperCase() + dn[1].slice(1).toLowerCase(), blocks: [], guessedDate: !baseDate }; days.push(cur); }
        continue;
      }
      const rm = raw.match(rowRe);
      if (!rm || !cur) continue;
      let rest = rm[3].trim().replace(/\s+\d{1,2}:\d{2}\s*$/, '');
      let who = '', what = '', where = '';
      const parts = rest.split(/\t+|\s{2,}/).map(s => s.trim()).filter(Boolean);
      if (parts.length >= 3 && whoEndRe.test(parts[parts.length - 1]) && !whoEndRe.test(parts[0])) {
        who = parts[parts.length - 1]; what = parts[0]; where = parts.slice(1, -1).join(' ');
      } else if (parts.length >= 2 && whoEndRe.test(parts[0]) && !whoEndRe.test(parts[parts.length - 1]) && parts[0].length < 24) {
        who = parts[0]; what = parts[1]; where = parts.slice(2).join(' ');
      } else if (parts.length >= 2 && whoEndRe.test(parts[parts.length - 1])) {
        who = parts[parts.length - 1]; what = parts[0]; where = parts.slice(1, -1).join(' ');
      } else {
        const wm = rest.match(whoRe);
        if (wm) { who = wm[1]; what = wm[2]; } else what = rest;
      }
      const kind = classify(what);
      const mine = isMine(kind, who, code);
      cur.blocks.push({ start: fmt(toMin(rm[1])), end: rm[2] ? fmt(toMin(rm[2])) : '', who, what, where, kind, mine });
    }
    // Several qualifying groups on one day: keep only the first as "mine" by default.
    for (const d of days) {
      const groups = d.blocks.filter(b => b.kind === 'session' && /group/i.test(b.what));
      groups.slice(1).forEach(b => { b.mine = false; b.flag = 'Other qualifying group: tick it if this is your driver\'s group'; });
    }
    return days;
  }

  /* ===== Plan engine (rewritten 2026-11-05, Rodrigo's review of the F2 simulations) =====
     - The team schedule comes first: arrival is before the driver's first commitment, and routine items
       that clash with a schedule block become "conflicts" the coach resolves (options write ev.edits).

      /* ---- Lunch label: depends on how close it is to the next session ---- */

        const D = j.daily || {};
        fcDays.forEach(d => { const k = (D.time || []).indexOf(d.date); if (k < 0) return; put(d, { tmin: r1(D.temperature_2m_min[k]), tmax: r1(D.temperature_2m_max[k]), hum: r1((D.relative_humidity_2m_mean || [])[k]), wind: r1(D.wind_speed_10m_max[k]), rain: r1((D.precipitation_probability_max || [])[k]) }, 'forecast'); });
      }
      if (farDays.length) {
        // Too far ahead for a forecast: use the same dates last year as a guide (no rain chance for past days)
        const shift = s => { const t = new Date(s + 'T12:00:00Z'); t.setUTCFullYear(t.getUTCFullYear() - 1); return isoDay(t); };
        const y = +shift(farDays[0].date).slice(0, 4);
        const j = await getJSON(`https://archive-api.open-meteo.com/v1/archive?latitude=${g.lat}&longitude=${g.lon}&timezone=auto&start_date=${shift(farDays[0].date)}&end_date=${shift(farDays[farDays.length - 1].date)}&daily=temperature_2m_max,temperature_2m_min,relative_humidity_2m_mean,wind_speed_10m_max,precipitation_sum`);
        const D = j.daily || {};
        farDays.forEach(d => { const k = (D.time || []).indexOf(shift(d.date)); if (k < 0) return; const mm = D.precipitation_sum[k]; put(d, { tmin: r1(D.temperature_2m_min[k]), tmax: r1(D.temperature_2m_max[k]), hum: r1((D.relative_humidity_2m_mean || [])[k]), wind: r1(D.wind_speed_10m_max[k]), rain: '' }, 'same dates ' + y + ' (too early for a forecast)'); });
      }
      ev.geo.at = Date.now(); state.wxMsg = ''; state.wxFailAt = 0; markDirty(); renderMain();
    } catch (e) {
      state.wxFailAt = Date.now();
      msg(inClaudeNow() ? 'Live forecasts cannot be reached from inside Claude. Type the forecast in the table, or use Typical weather.' : 'Could not reach the weather service from here' + (e && e.message ? ' (' + e.message + ')' : '') + '. Type the values in the table instead.');
    }
  }

  const sweatTxt = (s, mins) => { const a = parseFloat(s.pre), b = parseFloat(s.post), dr = parseFloat(s.drank) || 0, t = parseFloat(s.time) || mins; if (!(isFinite(a) && isFinite(b) && a > 0 && t > 0)) return ''; const r = (a - b + dr / 1000) / (t / 60); return r > 0 ? ' · sweat rate <b class="mono">' + r.toFixed(2) + ' l/h</b>' : ''; };
  function renderLog(m, ev) {

  /* ---------- Post-event report (Rodrigo 2026-11-05): event data → reflection → one A4 page ----------
     Spec: vault wiki/metodo/post-event-report.md · layout v2.3 (templates/report-pos-evento.html) · mock-ups 2026-11-05-report-tab-mockup.
     The report runs on the coach's data; athlete inputs (self-rating, later the check-in) only add to it. */
  const cUse = n => (typeof claude !== 'undefined' && claude && claude.use) ? claude.use(n).catch(() => null) : Promise.resolve(null);
  const RP = { area: 'summary', busy: '', msg: '', preview: false, open: {} };
  const RP_AREAS = [['mental', 'Mental performance'], ['physical', 'Physical'], ['wellbeing', 'Wellbeing']];
  const RP_TABS = [['summary', 'Summary'], ['mental', 'Mental'], ['physical', 'Physical'], ['wellbeing', 'Wellbeing']];
  const rpMean = a => { const v = a.filter(x => x != null && x !== '' && isFinite(x)).map(Number); return v.length ? v.reduce((p, q) => p + q, 0) / v.length : null; };
  const zLight = z => z == null ? '' : z > -1 ? 'g' : z > -2 ? 'a' : 'r';
  function rpStatus(avg, reds, any) { if (!any) return null; if ((avg != null && avg < 2.5) || reds >= 2) return 'Concern'; if ((avg != null && avg < 3.5) || reds === 1) return 'Watch'; return 'Strong'; }
  const stCls = s => s === 'Strong' ? 'g' : s === 'Watch' ? 'a' : s === 'Concern' ? 'r' : 'n';
  const lapFmt = v => v == null || !isFinite(v) ? '' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(3);
  const pctFmt = v => v == null || !isFinite(v) ? '' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + '%';
  const mdInline = t => esc(t || '').replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  const bullets = t => String(t || '').split(/\n+/).map(x => x.replace(/^\s*[-•*]\s*/, '').trim()).filter(Boolean);
  function rpEnsure(ev) {
    const r = ev.report = ev.report || {};
    r.f = r.f || {}; r.chips = r.chips || {}; r.drafted = r.drafted || {}; r.edited = r.edited || {};
    r.questions = r.questions || {}; r.notes = r.notes || {}; r.override = r.override || {}; r.goalSuggest = r.goalSuggest || [];

  }

  function reportData(ev) {
    const id = ev.athleteId, A = (CS.demo ? DEMO_ATH : state.athletes)[id] || state.athletes[id] || {};
    let planAll = []; try { planAll = RW.buildPlan(eff(ev)); } catch (e) {}
    const plan = planAll.filter(p => p.sess.length), log = ensureLog(ev); ev.results = ev.results || {};
    const days = plan.map(p => ({ date: p.day.date, label: p.day.label, short: WD3[dow(p.day.date)].toUpperCase() }));
    const sessions = [];
    plan.forEach(p => p.sess.forEach(x => { const k = resKey(p, x), type = sessType(x), r = ev.results[k] || {}; sessions.push({ k, date: p.day.date, short: x.short, type, r, c: resCalc(r, type), lg: log.sessions[k] || {}, dur: x.s.e > x.s.s ? x.s.e - x.s.s : null }); }));
    loadCheckins();
    const ci = days.map(d => id ? wlGet(id, d.date) : null);
    const num = v => v != null && v !== '' && isFinite(v) ? +v : null;
    /* Physical: readiness and soreness (check-in), driving minutes and load (Track log), morning weight */
    const phys = days.map((d, i) => {
      const c = ci[i], rd = readiness(c), ss = sessions.filter(s => s.date === d.date);
      const mins = ss.map(s => num(s.lg.time) != null ? num(s.lg.time) : (s.r.pos || s.lg.rpe != null && s.lg.rpe !== '' ? s.dur : null)).filter(v => v != null);
      const load = ss.map(s => { const t = num(s.lg.time) != null ? num(s.lg.time) : s.dur, rp = num(s.lg.rpe); return t != null && rp != null ? t * rp : null; }).filter(v => v != null);
      const kg = wlVal(c, 'kg') != null ? wlVal(c, 'kg') : parseFloat((log.morning || {})[d.date]) || null;
      return { readiness: rd ? rd.score : null, rdLight: rd ? rd.light : '', soreness: num(c && c.soreness), drive: mins.length ? mins.reduce((a, b) => a + b, 0) : null, load: load.length ? Math.round(load.reduce((a, b) => a + b, 0)) : null, kg };
    });
    /* Wellbeing: sleep, quality, energy, mood (check-in), HRV and resting HR vs his own normal */
    const well = days.map((d, i) => {
      const c = ci[i];
      return { sleep: num(c && c.sleepMin), sleepQ: num(c && c.sleepQ), energy: num(c && c.energy), mood: num(c && c.mood), motivation: num(c && c.motivation),
        hrv: num(c && c.hrv), hrvL: c && num(c.hrv) != null && id ? (mCls(id, 'hrv', d.date, c) || '') : '', rhr: num(c && c.rhr), rhrL: c && num(c.rhr) != null && id ? (mCls(id, 'rhr', d.date, c) || '') : '',
        comment: c && c.comment || '', flags: c ? [c.sick ? 'sick' : '', c.injured ? 'injured' : '', c.travel ? 'travel' : ''].filter(Boolean) : [] };
    });
    const hasWear = well.some(w => w.hrv != null || w.rhr != null);
    /* Mental: coach per day (status), weekend average (report), self-rating only when given */
    const ment = days.map(d => { const mm = (ev.mental || {})[d.date] || null; return { coach: mm ? mm.coach || {} : {}, self: mm && !mm.selfSkipped ? mm.self || {} : {}, skipped: !!(mm && mm.selfSkipped), note: mm ? mm.note || '' : '' }; });
    const pAvg = {}, sAvg = {};
    PILLARS.forEach(([k]) => { pAvg[k] = rpMean(ment.map(m => m.coach[k])); sAvg[k] = rpMean(ment.map(m => m.self[k])); });
    const hasSelf = PILLARS.some(([k]) => sAvg[k] != null);
    /* Status per area */
    const mCells = ment.flatMap(m => PILLARS.map(([k]) => num(m.coach[k]))).filter(v => v != null);
    const st = {

    const hd = `<tr><th></th>${D.days.map(d => `<th>${esc(d.short)}</th>`).join('')}${area === 'mental' ? '<th>Weekend</th>' + (D.hasSelf ? '<th class="sr">Driver self</th>' : '') : ''}</tr>`;

    let rows = '';

    if (area === 'physical') rows = [['Readiness (1–5)', D.phys.map(p => [p.readiness, p.rdLight, p.readiness != null ? p.readiness.toFixed(1) : null])], ['Soreness (1–5)', D.phys.map(p => [p.soreness, L('soreness', p.soreness)])], ['Driving (min)', D.phys.map(p => [p.drive, ''])], ['Load (min × RPE)', D.phys.map(p => [p.load, ''])], ['Morning weight (kg)', D.phys.map(p => [p.kg, '', p.kg != null ? p.kg.toFixed(1) : null])]].map(([n, v]) => `<tr><td class="lb">${n}</td>${v.map(x => cell(x[0], x[1], x[2])).join('')}</tr>`).join('');
    if (area === 'wellbeing') rows = [['Sleep (h)', D.well.map(w => [w.sleep, L('sleepMin', w.sleep), w.sleep != null ? hm(w.sleep) : null])], ['Sleep quality (1–5)', D.well.map(w => [w.sleepQ, L('x', w.sleepQ)])], ['Energy (1–5)', D.well.map(w => [w.energy, L('x', w.energy)])], ['Mood (1–5)', D.well.map(w => [w.mood, L('x', w.mood)])]].concat(D.hasWear ? [['HRV (ms)', D.well.map(w => [w.hrv, w.hrvL])], ['Resting HR (bpm)', D.well.map(w => [w.rhr, w.rhrL])]] : []).map(([n, v]) => `<tr><td class="lb">${n}</td>${v.map(x => cell(x[0], x[1], x[2])).join('')}</tr>`).join('');
    return `<div class="rp-gridwrap"><table class="rp-grid">${hd}${rows}</table></div>`;
  }
  function rpAreaCard(D, R, k, n) {

    const filled = ['verdict', 'insights', 'actions'].filter(x => (R.f[k + '.' + x] || '').trim()).length;
    return `<details class="card rp-area" data-rparea="${k}"${open ? ' open' : ''}><summary class="rp-ahead">${chev}<h2>${esc(n)}</h2>${st ? `<span class="rp-st ${stCls(st)}">${esc(st)}${ov ? ' · set by you' : ' · automatic'}</span>` : '<span class="rp-st n">No data</span>'}<span class="hint">${esc(kn)}${filled ? ' · ' + filled + '/3 written' : ''}</span></summary>

  function rpPanel(D, R) {

  function renderReport(m, ev) {
    const D = reportData(ev), R = rpEnsure(ev);

          <div><span class="hint">Avg RPE</span><b class="mono">${L.all.rpe == null ? '—' : L.all.rpe.toFixed(1)}</b></div>

      </div>`;
  }

  /* ---------- Race results (per event) + season view (per athlete) ---------- */
  const lapSec = t => { if (t == null || t === '') return null; const s = String(t).trim().replace(',', '.'); const m = s.match(/^(?:(\d+):)?(\d+(?:\.\d+)?)$/); return m ? (+(m[1] || 0)) * 60 + parseFloat(m[2]) : null; };
  const sessType = x => x.race ? 'race' : /quali|^q\d/i.test(x.short + ' ' + x.s.what) ? 'quali' : 'practice';
  const resKey = (p, x) => p.day.date + '|' + RW.fmt(x.s.s) + '|' + x.short;
  const posNum = v => { const n = parseInt(v, 10); return isFinite(n) ? n : null; };
  function resCalc(r, type) {
    r = r || {}; const out = {};
    const pos = posNum(r.pos), grid = posNum(r.grid);
    if (type === 'race' && pos != null && grid != null) out.gain = grid - pos;
    const b = lapSec(r.best), ref = lapSec((r.fastest || {}).best);
    if (b != null && ref != null && ref > 0) { out.deltaS = b - ref; out.deltaPct = (b - ref) / ref * 100; if (type !== 'race' && !String(r.gap || '').trim()) out.gapAuto = (out.deltaS >= 0 ? '+' : '−') + Math.abs(out.deltaS).toFixed(3); }
    out.mates = (r.mates || []).map((mt, i) => [mt, i]).filter(([mt]) => mt && (mt.name || mt.pos || mt.best)).map(([mt, i]) => {
      const mp = posNum(mt.pos), mb = lapSec(mt.best);
      return { name: mt.name || 'Team-mate ' + (i + 1), pos: mp, ahead: pos != null && mp != null ? pos < mp : null, lapDelta: b != null && mb != null ? b - mb : null, lapPct: b != null && mb ? (b - mb) / mb * 100 : null };
    });
    return out;
  }
  const sgn = (v, d) => (v > 0 ? '+' : v < 0 ? '−' : '±') + Math.abs(v).toFixed(d);

  /* Goals review at the end of the event (Rodrigo 2026-11-05) */
  const GOAL_ST = [['achieved', 'Achieved'], ['partial', 'Partial'], ['not', 'Not achieved']];
  function goalReviewHtml(ev) {
    const goals = (ev.goals || []).map((g, i) => [g, i]).filter(([g]) => g && String(g).trim());
    if (!goals.length) return '';
    ev.goalReview = ev.goalReview || [];
    return `<div class="card gr"><h2>Goals review</h2><p class="hint">How each goal set with the driver went. Feeds the post-event report.</p>
      ${goals.map(([g, i]) => { const r = ev.goalReview[i] || {}; return `<div class="gr-row"><span class="mono hint">${i + 1}</span><div><div>${esc(g)}</div><input data-grnote="${i}" value="${esc(r.note || '')}" placeholder="One line on why (optional)" aria-label="Note for goal ${i + 1}"></div>
        <div class="seg" role="group" aria-label="Goal ${i + 1} status">${GOAL_ST.map(([v, l]) => `<button data-gr="${i}|${v}" aria-pressed="${r.status === v}" class="gr-${v}">${l}</button>`).join('')}</div></div>`; }).join('')}</div>`;
  }
  function wireGoalReview(m, ev, rerender) {
    m.querySelectorAll('[data-gr]').forEach(b => b.onclick = () => { const [i, v] = b.dataset.gr.split('|'); ev.goalReview = ev.goalReview || []; const r = ev.goalReview[+i] = ev.goalReview[+i] || {}; r.status = r.status === v ? '' : v; markDirty(); rerender(); });
    m.querySelectorAll('[data-grnote]').forEach(inp => inp.oninput = () => { ev.goalReview = ev.goalReview || []; const r = ev.goalReview[+inp.dataset.grnote] = ev.goalReview[+inp.dataset.grnote] || {}; r.note = inp.value; markDirty(); });
  }
  function renderResults(m, ev) {
    ev.results = ev.results || {};
    const plan = RW.buildPlan(eff(ev)).filter(p => p.sess.length); const A = state.athletes[ev.athleteId] || {};
    if (!plan.length) { m.innerHTML = `<section class="panel"><div class="empty">Results appear once the timetable has at least one on-track session for the driver.</div></section>`; return; }
    const who = A.name || eff(ev).driverName || 'the driver';
    const q = (x) => encodeURIComponent([A.series, ev.name, x.short, 'results'].filter(Boolean).join(' '));
    const card = (p, x) => {
      const k = resKey(p, x), r = ev.results[k] || {}, type = sessType(x), c = resCalc(r, type);
      const mates = (r.mates || []).slice(); while (mates.length < 3) mates.push({});
      const f = (key, label, extra) => `<label class="f">${label}<input data-r="${key}" value="${esc(r[key] ?? '')}" ${extra || ''}></label>`;
      const done = r.pos || r.best;
      return `<div class="sess res" data-key="${esc(k)}" data-type="${type}">
        <div class="row" style="justify-content:space-between"><h3>${esc(x.short)} <span class="mono hint">${RW.fmt(x.s.s)}</span></h3><span class="row">${done ? `<span class="chip run">${type === 'race' ? 'P' + esc(r.pos || '?') : 'P' + esc(r.pos || '?')}</span>` : '<span class="chip">No result yet</span>'}${r.src === 'Claude' ? '<span class="chip">From document</span>' : ''}</span></div>
        <div class="row imp"><input type="file" accept="application/pdf,.pdf,image/*,.txt,.csv" data-rfile aria-label="Results document for ${esc(x.short)}"><a class="link" href="https://www.google.com/search?q=${q(x)}" target="_blank" rel="noopener">Find results online</a></div>
        <details class="paste"><summary class="hint">or paste the classification text</summary><textarea rows="4" data-rpaste placeholder="Paste the results table (from the PDF, the timing app or a website)"></textarea><button data-rread>Read pasted results</button></details>
        <span class="hint" data-rmsg role="status"></span>
        <div class="grid q">

        </div>
        <div class="mates"><span class="hint">Team-mates</span>${mates.map((mt, i) => `<div class="row mate"><input data-m="${i}" data-mk="name" value="${esc(mt.name ?? '')}" placeholder="Team-mate ${i + 1}" aria-label="Team-mate name"><input data-m="${i}" data-mk="pos" value="${esc(mt.pos ?? '')}" placeholder="Pos" inputmode="numeric" aria-label="Team-mate position" class="short"><input data-m="${i}" data-mk="best" value="${esc(mt.best ?? '')}" placeholder="Best lap" inputmode="numeric" data-lap aria-label="Team-mate best lap" class="mid"></div>`).join('')}</div>
        <div class="loss" data-rcalc>${calcHtml(r, type, c)}</div>
        <details class="res-more"><summary class="hint">More (optional): grid, status, gap, penalties, notes</summary>
        <div class="grid q">
          ${type === 'race' ? f('grid', 'Grid position', 'inputmode="numeric"') : ''}
          ${f('total', 'Cars classified', 'inputmode="numeric"')}
          ${f('bestRank', 'Best lap position', 'inputmode="numeric"')}
          ${type === 'race' ? `<label class="f">Status<select data-r="status">${['Finished', 'DNF', 'DNS', 'DSQ'].map(s => `<option${(r.status || 'Finished') === s ? ' selected' : ''}>${s}</option>`).join('')}</select></label>` : ''}
          ${type === 'race' ? f('gap', 'Gap to winner', 'placeholder="+4.512 or 1 lap"') : ''}
          <label class="f">${type === 'race' ? 'Winner' : 'P1 (pole)'}<input data-rr="leader.name" value="${esc((r.leader || {}).name ?? '')}"></label>

        </div>
        <label class="f">Incidents / what happened<textarea rows="2" data-r="incidents">${esc(r.incidents ?? '')}</textarea></label>
        <label class="f">Engineer feedback<textarea rows="2" data-r="eng">${esc(r.eng ?? '')}</textarea></label>
        </details>
      </div>`;
    };
    m.innerHTML = `<section class="panel">
      <div class="row" style="justify-content:space-between"><p class="hint">For each session, drop in the official classification (PDF, screenshot or pasted text) and Claude fills in ${esc(who)}'s result, P1 and the team-mates. Or type it in. Driver feedback stays in the Track log.</p>${ev.athleteId ? '<button id="toSeason">Season results</button>' : ''}</div>
      ${allButtons(plan.map(p => p.day.date))}
      ${plan.map(p => `<details class="card day" data-date="${esc(p.day.date)}"${isOpen(p.day.date) ? ' open' : ''}><summary class="daytitle">${chev}<h2>${esc(p.day.label)}</h2><span class="mono hint">${esc(p.day.date)}</span><span class="hint">${p.sess.map(x => { const r = ev.results[resKey(p, x)]; return x.short + (r && r.pos ? ' P' + r.pos : ''); }).join(' · ')}</span></summary>
        <div class="sesslist">${p.sess.map(x => card(p, x)).join('')}</div></details>`).join('')}
    </section>`;
    wireDetails(m);
    const ts = $('#toSeason'); if (ts) ts.onclick = () => { state.seasonAth = ev.athleteId; nav('season'); };
    m.querySelectorAll('.res').forEach(box => {
      const k = box.dataset.key, type = box.dataset.type;
      const R = () => (ev.results[k] = ev.results[k] || {});
      const refresh = () => { box.querySelector('[data-rcalc]').innerHTML = calcHtml(R(), type, resCalc(R(), type)); };
      box.querySelectorAll('[data-r]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => { R()[el.dataset.r] = el.value; if (!R().src) R().src = 'manual'; markDirty(); refresh(); }));
      box.querySelectorAll('[data-rr]').forEach(el => el.addEventListener('input', () => { const [o, f] = el.dataset.rr.split('.'); R()[o] = R()[o] || {}; R()[o][f] = el.value; markDirty(); refresh(); }));
      box.querySelectorAll('[data-m]').forEach(el => el.addEventListener('input', () => { const r = R(); r.mates = r.mates || []; const i = +el.dataset.m; r.mates[i] = r.mates[i] || {}; r.mates[i][el.dataset.mk] = el.value; markDirty(); refresh(); }));
      const msg = t => { box.querySelector('[data-rmsg]').textContent = t; };
      const read = async (input) => {
        msg('Claude is reading the results… (up to a minute)');
        try { const res = await readResults(ev, box.querySelector('h3').firstChild.textContent.trim(), type, input); ev.results[k] = Object.assign({}, ev.results[k] || {}, res, { src: 'Claude', incidents: (ev.results[k] || {}).incidents, eng: (ev.results[k] || {}).eng }); markDirty(); state.resMsg = { k, t: 'Filled from the document: check the numbers.' }; renderMain(); }
        catch (err) { msg((err && err.message) || 'Could not read that document. Type the result instead.'); }
      };
      box.querySelector('[data-rfile]').onchange = async e => {
        const f = e.target.files[0]; if (!f) return;
        const isPdf = /\.pdf$/i.test(f.name) || f.type === 'application/pdf', isImg = /^image\//.test(f.type);
        try {
          const txt = isImg ? '' : isPdf ? await pdfToText(f) : await f.text();
          await read(/\d[:.]\d{2}/.test(txt) ? { text: txt } : { images: isImg ? [f] : await pdfToImages(f) });
        } catch (err) { msg((err && err.message) || 'Could not open that file.'); }
      };
      box.querySelector('[data-rread]').onclick = () => { const t = box.querySelector('[data-rpaste]').value.trim(); if (t) read({ text: t }); else msg('Paste the results first.'); };
      if (state.resMsg && state.resMsg.k === k) { msg(state.resMsg.t); state.resMsg = null; }
    });
  }

  function calcHtml(r, type, c) {
    const bits = [];
    if (c.gain != null) bits.push(`Positions ${c.gain >= 0 ? 'gained' : 'lost'}: <b class="mono">${sgn(c.gain, 0)}</b>`);
    if (c.deltaPct != null) bits.push(`${type === 'race' ? 'Best lap vs fastest of the race' : type === 'quali' ? 'Gap to pole' : 'Gap to P1'}: <b class="mono">${sgn(c.deltaS, 3)} s</b> (<b class="mono">${sgn(c.deltaPct, 2)}%</b>)`);
    c.mates.forEach(mt => bits.push(`vs ${esc(mt.name)}: ${mt.ahead == null ? '' : `<b>${mt.ahead ? 'ahead' : 'behind'}</b>`}${mt.lapDelta != null ? `${mt.ahead == null ? '' : ' · '}best lap <b class="mono">${sgn(mt.lapDelta, 3)} s</b> (<b class="mono">${sgn(mt.lapPct, 2)}%</b>)` : ''}`));
    return bits.length ? bits.join('<br>') : 'Enter the position and best laps: the gaps to the fastest lap and to the team-mates are worked out here.';
  }

  async function readResults(ev, sessionName, type, input) {
    if (!state.sample) throw new Error('Claude is not available in this view. Type the result instead.');
    if (input.images) { let lim = null; try { lim = await state.sample.limits(); } catch (e) {} if (lim && !lim.images) throw new Error('Reading images is not available in this view. Paste the text or type the result.'); }
    const A = state.athletes[ev.athleteId] || {};
    const name = A.name || eff(ev).driverName || '';
    const prompt = `This is the official classification of a motorsport session (${sessionName}, a ${type === 'race' ? 'race' : type === 'quali' ? 'qualifying session' : 'practice/test session'}). Our driver: ${name}${A.number ? ', car number ' + A.number : ''}${A.team ? ', team ' + A.team : ''}. Team-mates are the other drivers of the same team${A.team ? ' (' + A.team + ')' : ''}. Reply with JSON only, shaped {"pos":"","grid":"","total":"","status":"Finished|DNF|DNS|DSQ","best":"m:ss.sss","bestRank":"","gap":"","penalty":"","leader":{"name":""},"fastest":{"name":"","best":"m:ss.sss"},"mates":[{"name":"","pos":"","best":"m:ss.sss"}]}. pos = our driver's classified position; grid = starting position if shown; total = number of cars classified; best = our driver's best lap; bestRank = rank of that best lap among all drivers; gap = gap to P1/winner as written; leader = P1 or race winner; fastest = fastest lap of the session and who set it; mates = team-mates' position and best lap. Leave a field empty if the document does not show it. Do not guess.` + (input.text ? '\n\nClassification:\n' + input.text.slice(0, 20000) : '');
    const res = await state.sample.json(prompt, input.images ? { images: input.images, modelTier: 'default' } : { modelTier: 'default' });
    if (!res || (!res.pos && !res.best)) throw new Error('Claude could not find ' + (name || 'the driver') + ' in that document. Check the athlete\'s name and car number in their profile, or type the result.');
    const S = v => v == null ? '' : String(v);
    return { pos: S(res.pos), grid: S(res.grid), total: S(res.total), status: S(res.status) || 'Finished', best: S(res.best), bestRank: S(res.bestRank), gap: S(res.gap), penalty: S(res.penalty), leader: { name: S((res.leader || {}).name) }, fastest: { name: S((res.fastest || {}).name), best: S((res.fastest || {}).best) }, mates: (res.mates || []).filter(x => x && x.name).map(x => ({ name: S(x.name), pos: S(x.pos), best: S(x.best) })) };
  }

  /* Season view for one athlete: every event, every session with a result */
  function seasonRows(a) {
    const evs = Object.values(state.events).filter(e => e.athleteId === a.id && (e.days || []).length).sort((x, y) => evStart(x) < evStart(y) ? -1 : 1);
    return evs.map(e => {
      let plan = []; try { plan = RW.buildPlan(eff(e)); } catch (x) {}
      const sess = [];
      plan.forEach(p => p.sess.forEach(x => { const r = (e.results || {})[resKey(p, x)]; if (r && (r.pos || r.best)) { const type = sessType(x); sess.push({ short: x.short, type, r, c: resCalc(r, type) }); } }));
      return { e, sess };
    });
  }
  function seasonHtml(a) {
    const rows = seasonRows(a); const all = rows.flatMap(x => x.sess);
    if (!all.length) return `<div class="card" id="season"><h3>Season results</h3><p class="hint">Nothing yet. Results entered in each event's Results tab build up here: qualifying and race positions, gap to the fastest lap, positions gained and head-to-head with team-mates.</p></div>`;
    const avg = arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null;
    const Q = all.filter(s => s.type === 'quali'), Rc = all.filter(s => s.type === 'race');
    const qPos = avg(Q.map(s => posNum(s.r.pos)).filter(v => v != null)), qPct = avg(Q.map(s => s.c.deltaPct).filter(v => v != null));
    const rPos = avg(Rc.filter(s => (s.r.status || 'Finished') === 'Finished').map(s => posNum(s.r.pos)).filter(v => v != null));
    const gain = Rc.map(s => s.c.gain).filter(v => v != null).reduce((s, v) => s + v, 0);
    const h2h = list => { let w = 0, l = 0; list.forEach(s => s.c.mates.forEach(mt => { if (mt.ahead === true) w++; else if (mt.ahead === false) l++; })); return w + l ? w + '–' + l : '—'; };
    const best = Rc.map(s => posNum(s.r.pos)).filter(v => v != null).sort((x, y) => x - y)[0];

  function renderNextEvent(m, ev, act, ctx) {

  }

  function sheetHtml(ev, p, ctx) {

  let dayFilter = 'all'; let dayDate = null;
  function renderDay(m) {
    const ctx = nowCtx(); const act = activeEvent(ctx.date); const ev = act.ev;
    if (!ev) { m.innerHTML = `<section class="tk"><div class="empty">No events yet.</div></section>`; return; }
    state.currentId = ev.id;
    const plan = RW.buildPlan(eff(ev)); if (!plan.length) { m.innerHTML = `<section class="tk"><div class="empty">Import the team timetable in the Event tab first.</div></section>`; return; }
    if (!dayDate || !plan.find(p => p.day.date === dayDate)) dayDate = (plan.find(p => p.day.date === ctx.date) || plan[0]).day.date;
    const i = plan.findIndex(p => p.day.date === dayDate), p = plan[i], isToday = p.day.date === ctx.date;
    const log = ensureLog(ev); const A = state.athletes[ev.athleteId];
    const all = p.items;

    if (isToday) {

      const started = all.filter(it => it.t <= ctx.min && it.t >= p.wake && !log.done[itemKey(p.day.date, it)]);
      const last = started[started.length - 1];
      if (!current.size && last && ctx.min - last.t <= 20) current.add(last);
      all.forEach(it => { if (it.kind === 'session' && it.end && it.t <= ctx.min && it.end > ctx.min) current.add(it); });
    }

    const items = all.filter(it => dayFilter === 'all' || LANE(it) === dayFilter || current.has(it));
    let nowDrawn = !isToday;
    const rows = items.map(it => {
      const k = itemKey(p.day.date, it), done = !!log.done[k], night = it.t < p.wake, isNow = current.has(it);
      const past = isToday && !isNow && (done || (it.until != null ? it.until < ctx.min : it.t < ctx.min));
      const big = it.kind === 'session';
      let s = '';
      if (!nowDrawn && it.t > ctx.min && !isNow) { nowDrawn = true; s += `<div class="rail-now"><span class="mono">${RW.fmt(ctx.min)}</span><span class="line"></span></div>`; }
      if (isNow) {
        const end = it.until != null ? it.until : (it.end || (items[items.indexOf(it) + 1] || {}).t || it.t + 15);
        const pct = Math.max(4, Math.min(100, Math.round((ctx.min - it.t) / Math.max(1, end - it.t) * 100)));
        const left = end - ctx.min;
        s += `<div class="rail-row"><span class="mono t">${RW.fmt(it.t)}</span><span class="node now lane-${LANE(it)}"></span>
          <div class="now-card lane-${LANE(it)}${it.kind === 'session' ? ' sess' : ''}"><div class="tk-row"><b>${esc(it.mac ? it.mac.head : it.short || it.label.split(':')[0].replace(/\s*\(\d+'\)\s*$/, ''))}</b><span class="nowtag">now</span></div>
          ${it.mac ? `<span class="hint">${esc(it.mac.c ? it.mac.c + ' carbs' : it.mac.rule)}</span>` : it.short ? (it.det ? `<span class="hint">${esc(it.det)}</span>` : '') : it.label.includes(':') ? `<span class="hint">${esc(it.label.split(':').slice(1).join(':').trim())}</span>` : ''}
          <div class="prog"><i style="width:${pct}%"></i></div>
          <div class="tk-row"><span class="hint">${left > 0 ? left + ' min left' : 'ending'}</span><button class="mini" data-done="${esc(k)}">${done ? 'Undo' : 'Done'}</button></div></div></div>`;
        return s;
      }
      if (big) {
        s += `<button class="rail-row as-btn" data-done="${esc(k)}" aria-label="${done ? 'Mark not done' : 'Mark done'}: ${esc(it.label)}"><span class="mono t">${RW.fmt(it.t)}</span><span class="node sq${past ? ' past' : ''}"></span>
          <span class="sess-block${past ? ' past' : ''}"><span>${esc(it.label.replace(/\s*\(\d+'\)\s*$/, ''))}${done ? ' ✓' : ''}</span><span class="mono">${it.end && it.end > it.t ? (it.end - it.t) + '′' : ''}</span></span></button>`;
        const sx = p.sess.find(x => x.s.s === it.t);
        if (sx && (!isToday ? p.day.date < ctx.date : sx.s.e <= ctx.min)) { const sk = keyS(p, sx), sst = sessState(ev, sk); s += `<button class="rail-row as-btn db-rail${dbDone(sst) ? ' ok' : ''}" data-debrief="${esc(sk)}"><span class="mono t">${RW.fmt(sx.s.e)}</span><span class="node lane-body${dbDone(sst) ? ' filled' : ''}"></span><span class="rail-label">Debrief ${esc(sx.short)} <span class="hint">· ${esc(dbSummary(sst) || 'to do')}</span></span></button>`; }
        return s;
      }
      if (hasBox(it)) { const op = macOpen.has(k); s += `<div class="rail-wrap${op ? ' open' : ''}"><button class="rail-row as-btn${past || night ? ' past' : ''}${done ? ' done' : ''}${it.warn ? ' warn' : ''}" data-done="${esc(k)}" aria-label="${done ? 'Mark not done' : 'Mark done'}: ${esc(shortOf(it))}"><span class="mono t">${night ? 'night' : RW.fmt(it.t)}</span><span class="node lane-${LANE(it)}${done ? ' filled' : ''}"></span><span class="rail-label">${esc(macLine(it))}${done ? ' ✓' : ''}</span></button>${macBtn(k, it)}${op ? macBox(it) : ''}</div>`; return s; }
      s += `<button class="rail-row as-btn${past || night ? ' past' : ''}${done ? ' done' : ''}${it.warn ? ' warn' : ''}${(it.tag === 'warmup' || it.tag === 'incar') ? ' strong' : ''}" data-done="${esc(k)}" aria-label="${done ? 'Mark not done' : 'Mark done'}: ${esc(it.label)}"><span class="mono t">${night ? 'night' : RW.fmt(it.t)}</span><span class="node lane-${LANE(it)}${done ? ' filled' : ''}"></span><span class="rail-label">${esc(it.label)}${done ? ' ✓' : ''}</span></button>`;
      return s;
    }).join('') + (nowDrawn ? '' : `<div class="rail-now"><span class="mono">${RW.fmt(ctx.min)}</span><span class="line"></span></div>`);
    const summary = isToday ? (nextSess ? `Next on track: <b>${esc(nextSess.short)}</b> in <b class="mono">${nextSess.s.s - ctx.min >= 60 ? Math.floor((nextSess.s.s - ctx.min) / 60) + 'h' + String((nextSess.s.s - ctx.min) % 60).padStart(2, '0') : (nextSess.s.s - ctx.min) + '′'}</b>` : 'No more sessions today') : esc(p.sess.map(x => x.short + ' ' + RW.fmt(x.s.s)).join(' · '));
    m.innerHTML = `<section class="tk day">
      <header class="day-sticky">
        <div class="tk-row"><button class="nav-day" id="dPrev" aria-label="Previous day" ${i === 0 ? 'disabled' : ''}>‹</button>
          <div class="day-title"><span class="day-name">${esc(p.day.label)} ${esc(String(+p.day.date.slice(8)))} ${esc(['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p.day.date.slice(5, 7) - 1])}</span><span class="hint">${esc((A && A.name) || eff(ev).driverName || '')} · ${esc(ev.name)}</span></div>

        <div class="filters">${[['all', 'All'], ['track', 'Track'], ['fuel', 'Fuel'], ['fluid', 'Fluid'], ['body', 'Body']].map(f => `<button data-filter="${f[0]}" aria-pressed="${dayFilter === f[0]}" class="lane-${f[0]}"><span class="dot"></span>${f[1]}</button>`).join('')}</div>
      </header>

    m.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { dayFilter = b.dataset.filter; renderMode(); });

    $('#dNext').onclick = () => { if (i < plan.length - 1) { dayDate = plan[i + 1].day.date; state.scrolledNow = false; renderMode(); } };
    wireTrack(m, ev, p, ctx);
    if (isToday && !state.scrolledNow) { const el = m.querySelector('.now-card') || m.querySelector('.rail-now'); if (el) { state.scrolledNow = true; el.scrollIntoView({ block: 'center' }); } }
  }

  /* ---------- Driver view (Rodrigo 2026-11-11, A + D): brief for today, status, focus, ask him today, also on your mind ---------- */
  const DV = { busy: false, msg: '', ansOpen: null };
  function dvFacts(ev, date) {
    const A = state.athletes[ev.athleteId] || {}, E = eff(ev), log = ensureLog(ev), plan = RW.buildPlan(E);
    const p = plan.find(x => x.day.date === date) || null, prev = plan.filter(x => x.day.date < date && x.sess.length).pop() || null;
    loadCheckins(); const c = wlGet(ev.athleteId, date), r = readiness(c ? Object.assign({ athleteId: ev.athleteId, date }, c) : null);
    const au = c ? wlAuto(ev.athleteId, date, c) : null;
    const yday = prev ? prev.sess.map(x => { const k = keyS(prev, x), s = log.sessions[k] || {}, res = (ev.results || {})[k] || {}, pre = parseFloat(s.pre), post = parseFloat(s.post);
      return { key: k, name: x.short, date: prev.day.date, day: prev.day.label, lossPct: isFinite(pre) && isFinite(post) && pre > 0 ? Math.round((pre - post) / pre * 1000) / 10 : null, drankMl: s.drank ? +s.drank : null, rpe: s.rpe !== '' && s.rpe != null ? +s.rpe : null, thermal: s.tsens ? +s.tsens : null, said: s.notes || '', coach: s.coach || '', pos: res.pos || null, best: res.best || null }; }) : [];
    const dayRow = (ev.days || []).find(d => d.date === date) || {};
    const lines = String(dayRow.prompts || '').split(/\n+/).map(t => t.trim()).filter(Boolean);
    const notes = (CS.demo ? QL.demoNotes : QL.notes).filter(n => n.athleteId === ev.athleteId && !n.done && n.type !== 'Weight' && n.text && n.date >= addD(date, -4) && n.date <= date).sort((x, y) => (y.ts || 0) - (x.ts || 0));
    const memos = (log.memos || []).filter(mm => !mm.done && mm.text && (!mm.ts || Date.now() - mm.ts < 4 * 864e5));
    return { A, E, log, plan, p, prev, c, r, au, yday, lines, goals: (ev.goals || []).filter(Boolean), notes, memos };
  }
  // Questions the app suggests from what stands out; ids are stable so ticks survive a re-render
  function dvAuto(F, date) {
    const q = [], c = F.c || {};
    F.notes.slice(0, 3).forEach(n => q.push({ id: 'n:' + n.id, text: String(n.text).replace(/\s+/g, ' ').slice(0, 110), src: 'Note · ' + (n.type || 'general') + (n.date ? ' · ' + fmtD(n.date) : '') }));
    if (c.sleepMin != null && c.sleepMin < 420) q.push({ id: 'a:sleep', text: 'Slept badly, or just went to bed late?', src: 'Check-in · ' + hm(c.sleepMin) });
    if (F.au && F.au.hrv.light && F.au.hrv.light !== 'g' && F.au.hrv.dir === 'low') q.push({ id: 'a:hrv', text: 'Anything unusual last night (late meal, stress, travel)?', src: 'HRV ' + F.au.hrv.d.toFixed(1) + ' SD vs his normal' });
    if (c.soreness != null && c.soreness >= 3) q.push({ id: 'a:sore', text: 'Where is the soreness, and does it change how he drives?', src: 'Check-in · soreness ' + c.soreness });

  /* ===== Wellness: daily morning check-in + Wellness page (Rodrigo, sessão 2026-11-05) =====
     Check-in filled by the coach for now (by: 'coach'); moves to the athlete with the athlete view.
     Data: collection "checkins", doc <athleteId>_<YYYY-MM-DD>; localStorage fallback. Demo check-ins live in memory only.
     Traffic light: scales 1–5 green >=4, amber 3, red <=2 (soreness inverted); sleep green >=8 h, amber 7–8 h, red <7 h.
     Readiness 1–5 = weighted average: sleep 35% (half hours, half quality), energy 25%, soreness 20% (inverted),
     mood 10%, motivation 10%; missing answers re-weight the rest. Light: >=4 green, >=3 amber, else red;
     any red answer caps the light at amber (Rodrigo, sessão 2026-11-05). */
  const WL_LS = 'rwp-checkins-v1';

  const WL_SCALES = [['sleepQ', 'Sleep quality'], ['energy', 'Energy'], ['mood', 'Mood'], ['motivation', 'Motivation'], ['soreness', 'Soreness']];
  const wlKey = (id, d) => id + '_' + d;
  function loadCheckins() {
    if (WL.loaded) return; WL.loaded = true;
    if (state.db) {
      state.db.collection('checkins').onSnapshot(snap => {
        const next = {}; snap.docs.forEach(d => { const x = d.data(); if (x) next[d.id] = JSON.parse(JSON.stringify(x)); }); WL.list = next; WL.ver = (WL.ver || 0) + 1;
        if (WL.sheet) return; const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
        if (['home', 'wellness', 'today', 'driver'].includes(state.mode)) renderMode(); else if (state.view === 'calendar') try { calRefresh(); } catch (e) {}
      }, () => {});
    } else { try { WL.list = JSON.parse(localStorage.getItem(WL_LS) || '{}') || {}; } catch (e) { WL.list = {}; } }
  }
  const wlStore = () => CS.demo ? wlDemo() : WL.list;
  const wlGet = (id, d) => wlStore()[wlKey(id, d)] || null;
  const hm = min => min == null || !isFinite(min) ? '—' : Math.floor(min / 60) + 'h' + String(Math.round(min % 60)).padStart(2, '0');
  const toMin = s => { const m = /^(\d{1,2}):(\d{2})$/.exec(s || ''); return m ? +m[1] * 60 + +m[2] : null; };
  function sleepOf(bed, wake) { const b = toMin(bed), w = toMin(wake); if (b == null || w == null) return null; let d = w - b; if (d <= 0) d += 1440; return d > 16 * 60 ? null : d; }
  /* light per answer: 'g' | 'a' | 'r' | '' */
  function wlLight(k, v) {
    if (v == null || v === '' || !isFinite(v)) return '';
    if (k === 'sleepMin') return v >= 480 ? 'g' : v >= 420 ? 'a' : 'r';
    if (k === 'soreness') return v <= 2 ? 'g' : v === 3 ? 'a' : 'r';
    return v >= 4 ? 'g' : v === 3 ? 'a' : 'r';
  }
  const sleepScore = min => Math.max(1, Math.min(5, 1 + (min / 60 - 5) * 4 / 3)); /* 5 h → 1, 8 h → 5 */
  function readiness(c) {
    if (!c) return null;
    const parts = [], num = v => v != null && v !== '' && isFinite(v) ? +v : null;
    const sl = [num(c.sleepMin) != null ? sleepScore(+c.sleepMin) : null, num(c.sleepQ)].filter(v => v != null);
    if (sl.length) parts.push([sl.reduce((a, b) => a + b, 0) / sl.length, .35]);
    if (num(c.energy) != null) parts.push([+c.energy, .25]);
    if (num(c.soreness) != null) parts.push([6 - c.soreness, .20]);
    if (num(c.mood) != null) parts.push([+c.mood, .10]);
    if (num(c.motivation) != null) parts.push([+c.motivation, .10]);
    if (!parts.length) return null;
    const w = parts.reduce((s, p) => s + p[1], 0), score = Math.round(parts.reduce((s, p) => s + p[0] * p[1], 0) / w * 10) / 10;
    const reds = ['sleepMin'].concat(WL_SCALES.map(x => x[0])).filter(k => wlLight(k, num(c[k])) === 'r');
    let light = score >= 4 ? 'g' : score >= 3 ? 'a' : 'r';
    if (light === 'g' && reds.length) light = 'a';
    const auto = [];
    if (c.athleteId && c.date) { const A = wlAuto(c.athleteId, c.date, c); if (A.hrv.light && A.hrv.light !== 'g') auto.push('hrv'); if (A.rhr.light && A.rhr.light !== 'g') auto.push('rhr'); }
    if (light === 'g' && auto.length) light = 'a';
    return { score, light, reds, auto };
  }
  /* HRV, resting HR and sleep hours: Hintsa method (vault: wiki/conceitos/hrv-readiness; Rodrigo, sessão 2026-11-06).
     The day's value vs the mean ± SD of the previous 6 weeks (option: previous week). HRV in ms, as Garmin gives it.
     Green within 1 SD; amber 1–2 SD; red beyond 2 SD. HRV and sleep count both ways (a long night is amber too);
     resting HR only when it rises. HRV or resting HR outside green caps a green readiness at amber (no weights). */
  const H_KEYS = { hrv: 'two', rhr: 'up', sleepMin: 'two' };
  const HB_LS = 'rwp-wl-hbase';
  try { WL.hbase = localStorage.getItem(HB_LS) === '1w' ? '1w' : '6w'; } catch (e) { WL.hbase = '6w'; }
  const hbTxt = () => WL.hbase === '1w' ? '1-week average' : '6-week average';
  function hBase(id, k, date, cur) {
    const n = WL.hbase === '1w' ? 7 : 42, min = WL.hbase === '1w' ? 3 : 7, st = wlStore(), v = [];
    for (let i = 1; i <= n; i++) { const c = st[wlKey(id, addD(date, -i))]; const x = wlVal(c, k); if (x != null && (k !== 'hrv' && k !== 'rhr' || x > 0)) v.push(x); }
    if (v.length < min) return null;
    const m = v.reduce((a, b) => a + b, 0) / v.length, sd = Math.sqrt(v.reduce((q, x) => q + (x - m) ** 2, 0) / v.length);

  const WL_AUTO = new Map();
  function wlAuto(id, date, cur) {
    const key = (CS.demo ? 'd' : 'r') + '|' + id + '|' + date + '|' + (WL.ver || 0) + '|' + WL.hbase + '|' + (cur ? [cur.hrv, cur.rhr].join(',') : '');

    const c = cur || wlGet(id, date);
    const one = k => { const v = wlVal(c, k), b = hBase(id, k, date); const L = hLight(k, v, b); return L ? { st: L.light === 'g' ? 'ok' : L.dir, light: L.light, v, m: b.m, sd: b.sd, lo: b.m - b.sd, hi: b.m + b.sd, d: L.d, n: b.n } : { st: null, light: null, v, n: b ? b.n : 0 }; };

  }
  const LIGHT_TXT = { g: 'Green', a: 'Amber', r: 'Red' }, LIGHT_RD = { g: 'go', a: 'watch', r: 'stop' };
  const LBL = { sleepMin: 'sleep', sleepQ: 'sleep quality', energy: 'energy', mood: 'mood', motivation: 'motivation', soreness: 'soreness' };
  function wlSummary(c) {
    const r = readiness(c); if (!r) return '';
    const bits = [];
    if (c.sleepMin != null) bits.push((wlLight('sleepMin', c.sleepMin) === 'g' ? 'slept ' : 'short night, ') + hm(c.sleepMin));
    ['energy', 'mood', 'motivation', 'sleepQ'].forEach(k => { if (wlLight(k, c[k]) !== 'g' && c[k] != null) bits.push(LBL[k] + ' ' + c[k]); });
    if (c.soreness >= 3) bits.push('soreness ' + c.soreness + (c.sorenessArea ? ' (' + c.sorenessArea + ')' : ''));
    if (r.light === 'g' && bits.length <= 1 && !(r.auto || []).length) bits.push('all good');
    (r.auto || []).forEach(k => { const A = wlAuto(c.athleteId, c.date, c); bits.push(k === 'hrv' ? 'HRV ' + (A.hrv.st === 'high' ? 'above' : 'below') + ' normal' : 'resting HR above normal'); });
    return LIGHT_TXT[r.light] + ' · ' + r.score.toFixed(1) + ' · ' + bits.join(', ');
  }
  function lastDays(id, n, end) { const t = end || todayStr(); return Array.from({ length: n }, (_, i) => addD(t, i - n + 1)).map(d => ({ d, c: wlGet(id, d) })); }
  function avg7(id, k, date) { const v = lastDays(id, 7, addD(date, -1)).map(x => x.c && x.c[k]).filter(x => x != null && x !== '' && isFinite(x)).map(Number); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }
  function missingRun(id) { let n = 0; for (let d = todayStr(); n < 14 && !wlGet(id, d); d = addD(d, -1)) n++; return n; }
  const isRaceWeek = id => spansFor(id).some(s => (s.cat === 'race' || s.cat === 'test') && addD(s.start, -2) <= todayStr() && addD(s.end, 1) >= todayStr());
  /* Home tiles: same shape the demo used (rd, rdTxt, ci, sleep, hrv, trend, comp) */
  function homeDD(id) {
    loadCheckins();

    const trend = lastDays(id, 7).map(x => { const rr = readiness(x.c); return rr ? rr.score : null; }), trendL = lastDays(id, 7).map(x => { const rr = readiness(x.c); return rr ? rr.light : null; });

    return {

  /* ---------- body mass: morning baseline (vault: variabilidade-peso-matinal; Rodrigo, 2026-10-29) ----------
     Valid weighing = morning, after the toilet, before eating or drinking, same scale (race-weekend morning
     weigh-in, or a Weight logged before 11:00). Baseline = mean of the valid mornings of the last 7 days,
     at least 3; until then the profile weight stays. Below the baseline by more than 1 % = probable water
     deficit (ACSM 2007): not counted, hydration alert. Above by more than 2 % = not counted, the coach decides.
     The morning after a carb-load day the rise is expected (glycogen stores water) and is not counted. */
  const W_LOW = 0.01, W_HIGH = 0.02, W_DAYS = 7, W_MIN = 3;
  const keyW = e => e.date + '|' + e.kg;
  const asList = v => Array.isArray(v) ? v : (v ? [v] : []);
  async function saveAthleteDoc(A) {
    try { if (state.db) await state.db.collection('athletes').doc(A.id).set(JSON.parse(JSON.stringify(A))); else localStorage.setItem(LS + '-athletes', JSON.stringify(state.athletes)); } catch (e) { setStatus('Profile not saved: ' + ((e && e.message) || 'try again'), true); }
  }
  function morningWeights(athId) {
    const by = {};
    QL.notes.filter(n => n.athleteId === athId && n.type === 'Weight' && n.kg && (n.time || '') < '11:00').forEach(n => { const kg = parseFloat(n.kg); if (kg > 0 && (!by[n.date] || (n.ts || 0) >= by[n.date].ts)) by[n.date] = { date: n.date, kg, ts: n.ts || 0 }; });
    Object.values(state.events).filter(e => e.athleteId === athId && !e.demo).forEach(e => Object.entries(((e.log || {}).morning) || {}).forEach(([d, kg]) => { const v = parseFloat(kg); if (v > 0 && !by[d]) by[d] = { date: d, kg: v, ts: 0 }; }));
    return Object.values(by).sort((a, b) => a.date < b.date ? -1 : 1);
  }
  function carbMornings(athId) {
    const s = new Set();
    Object.values(state.events).filter(e => e.athleteId === athId && !e.demo).forEach(e => { try { const c = carbLoad(e); if (c) c.nights.forEach(n => s.add(n.raceDate)); } catch (x) {} });
    return s;
  }
  const meanKg = arr => arr.reduce((t, e) => t + e.kg, 0) / arr.length;
  function weightState(athId) {
    const A = state.athletes[athId]; if (!A) return null;
    const ok = asList(A.weightOk), carb = carbMornings(athId), valid = [], entries = [];
    morningWeights(athId).forEach(e => {
      const prev = valid.filter(v => v.date < e.date && v.date > addD(e.date, -W_DAYS));
      const base = prev.length >= W_MIN ? meanKg(prev) : null, ref = base || (parseFloat(A.mass) > 0 ? parseFloat(A.mass) : null);
      const d = ref ? (e.kg - ref) / ref : 0;
      let st = 'valid';
      if (carb.has(e.date)) st = 'carb';
      else if (ref && d < -W_LOW) st = 'low';
      else if (ref && d > W_HIGH && !ok.includes(keyW(e))) st = 'high';
      if (st === 'valid') valid.push(e);
      entries.push(Object.assign({}, e, { st, ref, base, pct: Math.abs(d * 100).toFixed(1) }));
    });
    const t = todayStr(), recent = valid.filter(v => v.date > addD(t, -W_DAYS));
    return { entries, n: recent.length, base: recent.length >= W_MIN ? Math.round(meanKg(recent) * 10) / 10 : null };
  }
  function syncProfileMass(athId) {
    const A = state.athletes[athId], ws = weightState(athId); if (!A || !ws || ws.base == null) return ws;
    if (Math.abs((parseFloat(A.mass) || 0) - ws.base) >= 0.05) { A.mass = ws.base; A.massDate = todayStr(); A.updatedAt = Date.now(); saveAthleteDoc(A); }
    return ws;
  }
  function applyMorningWeight(athId, kg, date) {
    if (CS.demo || !state.athletes[athId] || !(parseFloat(kg) > 0)) return null;
    const ws = syncProfileMass(athId); if (!ws) return null;
    const e = ws.entries.find(x => x.date === date);
    return e ? { st: e.st, pct: e.pct, base: ws.base, n: ws.n } : null;
  }
  const weightTxt = r => !r ? '' : r.st === 'valid' ? (r.base != null ? ` Counted in the 7-day baseline (${r.n} mornings): profile ${r.base} kg.` : ` Counted: ${r.n} of ${W_MIN} mornings needed for a baseline, so the profile is unchanged.`)
    : r.st === 'low' ? ` ${r.pct}% below the reference: not counted. Possible water deficit, check hydration.`
    : r.st === 'high' ? ` ${r.pct}% above the reference: not counted. Check it on Home.`
    : ' Morning after a carb-rich dinner (race day): the rise is expected (water stored with glycogen) and is not counted.';
  function weightFlag(athId) {
    const A = state.athletes[athId]; if (!A || CS.demo) return null;
    const ws = weightState(athId); if (!ws || !ws.entries.length) return null;
    const e = ws.entries[ws.entries.length - 1];
    if (e.st === 'valid' || e.date < addD(todayStr(), -2) || asList(A.weightSkip).includes(keyW(e))) return null;
    return { ath: athId, kg: e.kg, date: e.date, last: Math.round(e.ref * 10) / 10, pct: e.pct, st: e.st, base: e.base != null };
  }

  /* ---------- Season results: its own page (also stays in the profile) ---------- */
  function renderSeasonPage(m) {
    if (CS.demo) ensureDemoEvents();
    const list = athList();
    const id = state.focus !== 'all' && list.some(a => a.id === state.focus) ? state.focus : (state.seasonAth && list.some(a => a.id === state.seasonAth) ? state.seasonAth : (list[0] || {}).id);
    const a = list.find(x => x.id === id);
    m.innerHTML = `<section class="panel page"><div class="page-head"><h1>Season results</h1>${a ? `<span class="hint">${esc(a.name || 'Unnamed')}${a.series ? ' · ' + esc(a.series) : ''}</span>` : ''}</div>
      ${list.length > 1 && state.focus === 'all' ? `<div class="home-chips" style="display:flex">${list.map(x => `<button data-sath="${esc(x.id)}" aria-pressed="${x.id === id}"><span class="dot" style="--ad:${athColor(x.id)}"></span>${esc(x.name || 'Unnamed')}</button>`).join('')}</div>` : ''}
      ${a ? seasonHtml(a) : '<div class="empty">Add an athlete in Profiles to see their season.</div>'}
      ${a && CS.demo ? '<p class="hint">Demo drivers have no results yet. Results entered in each event’s Results tab build this page.</p>' : ''}</section>`;
    m.querySelectorAll('[data-sath]').forEach(b => b.onclick = () => { state.seasonAth = b.dataset.sath; renderSeasonPage(m); });
    m.querySelectorAll('[data-openev]').forEach(b => b.onclick = () => openEvent(b.dataset.openev, 'results'));
    if (a) { try { drawSeasonChart(a); } catch (e) {} }
  }
  window.addEventListener('resize', () => { if (state.mode === 'season') { const a = athList().find(x => x.id === (state.focus !== 'all' ? state.focus : state.seasonAth)) || athList()[0]; if (a) try { drawSeasonChart(a); } catch (e) {} } });

  /* ---------- Notes: every note and log in one place (weekly email digest: next phase) ---------- */
  const NS = { type: 'all', src: 'all', q: '', edit: null, del: null, hideDone: false };
  function allNotes(ids) {
    const out = [];
    Object.values(state.events).filter(e => ids.includes(e.athleteId) && !!e.demo === !!CS.demo).forEach(ev => ((ev.log || {}).memos || []).forEach(mm => {
      const date = mm.ts ? localDate(new Date(mm.ts)) : (((ev.days || []).find(d => d.label === mm.day) || {}).date || evStart(ev) || '');
      out.push({ key: 'm:' + ev.id + ':' + mm.id, kind: 'memo', ev, ref: mm, ath: ev.athleteId, type: mm.type || 'General', vis: mm.vis, text: mm.text, kg: mm.kg, date, time: mm.time || '', ts: mm.ts || Date.parse(date + 'T' + (mm.time || '12:00')) || 0 });
    }));
    (CS.demo ? QL.demoNotes : QL.notes).filter(n => ids.includes(n.athleteId)).forEach(n => out.push({ key: 'n:' + n.id, kind: 'note', ref: n, ath: n.athleteId, type: n.type || 'General', vis: n.vis, text: n.text, kg: n.kg, date: n.date, time: n.time, ts: n.ts || 0 }));
    return out.sort((x, y) => x.date === y.date ? y.ts - x.ts : (x.date < y.date ? 1 : -1));
  }
  async function persistMemoEvent(ev) { if (ev.demo) return; const prev = state.currentId; state.currentId = ev.id; markDirty(); await save(); if (prev && state.events[prev]) state.currentId = prev; }
  async function persistNote(n, del) {
    if (CS.demo) return;
    try { if (state.db) { const ref = state.db.collection('notes').doc(n.id); del ? await ref.delete() : await ref.set(JSON.parse(JSON.stringify(n))); } else localStorage.setItem(NOTES_LS, JSON.stringify(QL.notes)); setStatus(state.db ? 'Saved' : 'Saved on this device'); }
    catch (e) { setStatus('Not saved: ' + ((e && e.message) || 'try again'), true); }
  }
  /* Notes and Track log memos can be marked done by the coach: they leave On your mind but stay in Notes (and in the Track log). */
  function noteRef(it) {
    if (it.evId) { const ev = state.events[it.evId]; const mm = ev && ((ev.log || {}).memos || []).find(x => x.id === it.id); return mm ? { ref: mm, ev } : null; }
    const n = (CS.demo ? QL.demoNotes : QL.notes).find(x => x.id === it.id); return n ? { ref: n } : null;
  }
  function setNoteDone(it, done) {
    const r = it.ref ? { ref: it.ref, ev: it.ev } : noteRef(it); if (!r) return;
    if (done) r.ref.done = Date.now(); else delete r.ref.done;
    if (r.ev) persistMemoEvent(r.ev); else persistNote(r.ref);
  }
  function renderNotesPage(m) {
    if (CS.demo) { ensureDemoEvents(); seedDemoNotes(); } else loadNotes();
    const list = focusList(), many = list.length > 1, name = id => (athList().find(a => a.id === id) || {}).name || '';
    const all = allNotes(list.map(a => a.id));
    m.innerHTML = `<section class="panel page notes-page"><div class="page-head"><h1>Notes</h1><span class="hint">${all.length} ${all.length === 1 ? 'entry' : 'entries'}${!many && list[0] ? ' · ' + esc(list[0].name || '') : ''}</span><button class="primary" id="nsLog" style="margin-left:auto">${pwIco('pen', 15)} Log</button></div>
      <div class="ns-filters"><div class="ql-types" role="group" aria-label="Type">${['all'].concat(QL_TYPES).map(t => `<button data-nst="${t}" aria-pressed="${NS.type === t}">${t === 'all' ? 'All' : t === 'Performance strategy' ? 'Performance' : t}</button>`).join('')}</div>
        <div class="ns-row"><select id="nsSrc" aria-label="Source"><option value="all">All sources</option><option value="memo"${NS.src === 'memo' ? ' selected' : ''}>Track log (events)</option><option value="note"${NS.src === 'note' ? ' selected' : ''}>Notes (outside events)</option></select><input id="nsQ" type="search" placeholder="Search notes" aria-label="Search notes" value="${esc(NS.q)}"><label class="tgl"><input type="checkbox" id="nsDone"${NS.hideDone ? ' checked' : ''}> Hide done</label></div></div>
      <div id="nsList"></div>
      <p class="hint">A weekly summary of these notes by email is planned for a later phase.</p></section>`;
    const draw = () => {
      const q = NS.q.trim().toLowerCase();
      const rows = all.filter(x => (!NS.hideDone || !x.ref.done) && (NS.type === 'all' || x.type === NS.type) && (NS.src === 'all' || x.kind === NS.src) && (!q || (x.text || '').toLowerCase().includes(q) || (x.ev && (x.ev.name || '').toLowerCase().includes(q))));
      const el = m.querySelector('#nsList');
      if (!rows.length) { el.innerHTML = `<div class="empty">${all.length ? 'No notes match these filters.' : 'No notes yet. Use Log to write the first one.'}</div>`; return; }
      let html = '', wk = null;
      rows.forEach(x => {
        const w = x.date ? isoWeek(x.date) : null, wkey = w ? w.year + '-' + w.week : '?';
        if (wkey !== wk) { if (wk !== null) html += '</ul>'; wk = wkey; const mon = w ? weekMon(w.year, w.week) : null; html += `<h2 class="ns-week">${w ? 'Week ' + w.week + ' · ' + fmtR(mon, addD(mon, 6)) : 'No date'}</h2><ul class="ns-list">`; }
        const editing = NS.edit === x.key, deleting = NS.del === x.key;
        html += `<li${x.ref.done ? ' class="ns-done"' : ''}><div class="ns-meta"><span class="chip">${esc(x.type === 'Performance strategy' ? 'Performance' : x.type)}</span>${many ? `<span class="adot" style="--ad:${athColor(x.ath)}"></span><b>${esc(name(x.ath))}</b>` : ''}<span class="hint">${esc((x.date ? fmtD(x.date) : '') + (x.time ? ' ' + x.time : ''))}${x.kind === 'memo' ? ' · ' + esc(x.ev.name || 'Event') + ' · Track log' : ''}</span>${x.vis === 'coach' ? `<span class="hint">${lockIco} Coach only</span>` : '<span class="hint">Shared</span>'}${x.ref.done ? `<span class="chip ns-donechip">${pwIco('check', 13)} Done ${esc(fmtD(localDate(new Date(x.ref.done))))}</span>` : ''}</div>
          ${editing ? `<textarea id="neText" rows="3" aria-label="Note">${esc(x.text)}</textarea><div class="ns-row"><select id="neVis" aria-label="Who sees it"><option value="coach"${x.vis === 'coach' ? ' selected' : ''}>Coach only</option><option value="shared"${x.vis !== 'coach' ? ' selected' : ''}>Shared with driver</option></select><button class="primary" data-nsave="${esc(x.key)}">Save</button><button data-ncancel>Cancel</button></div>`
            : `<p>${x.kg ? `<b class="mono">${esc(x.kg)} kg</b> ` : ''}${esc(x.text)}</p>`}
          ${editing ? '' : deleting ? `<div class="ns-row"><span class="flag">Delete this note?</span><button data-nyes="${esc(x.key)}">Delete</button><button data-ncancel>Keep</button></div>` : `<div class="ns-acts"><button class="x" data-ndone="${esc(x.key)}">${x.ref.done ? 'Reopen' : 'Mark done'}</button><button class="x" data-nedit="${esc(x.key)}">Edit</button><button class="x" data-ndel="${esc(x.key)}">Delete</button>${x.kind === 'memo' ? `<button class="x" data-nopen="${esc(x.ev.id)}">Open event</button>` : ''}</div>`}</li>`;
      });
      el.innerHTML = html + '</ul>';
      const find = k => all.find(x => x.key === k);
      el.querySelectorAll('[data-nedit]').forEach(b => b.onclick = () => { NS.edit = b.dataset.nedit; NS.del = null; draw(); const t = el.querySelector('#neText'); if (t) t.focus(); });
      el.querySelectorAll('[data-ndel]').forEach(b => b.onclick = () => { NS.del = b.dataset.ndel; NS.edit = null; draw(); });
      el.querySelectorAll('[data-ncancel]').forEach(b => b.onclick = () => { NS.edit = NS.del = null; draw(); });
      el.querySelectorAll('[data-nopen]').forEach(b => b.onclick = () => openEvent(b.dataset.nopen, 'log'));
      el.querySelectorAll('[data-ndone]').forEach(b => b.onclick = () => { const x = find(b.dataset.ndone); if (!x) return; setNoteDone(x, !x.ref.done); draw(); });
      el.querySelectorAll('[data-nsave]').forEach(b => b.onclick = async () => {
        const x = find(b.dataset.nsave); if (!x) return; const t = el.querySelector('#neText').value.trim(); if (!t && !x.kg) { el.querySelector('#neText').focus(); return; }
        x.ref.text = t; x.ref.vis = el.querySelector('#neVis').value; NS.edit = null;
        if (x.kind === 'memo') await persistMemoEvent(x.ev); else await persistNote(x.ref);
        renderNotesPage(m);
      });
      el.querySelectorAll('[data-nyes]').forEach(b => b.onclick = async () => {
        const x = find(b.dataset.nyes); if (!x) return; NS.del = null;
        if (x.kind === 'memo') { x.ev.log.memos = x.ev.log.memos.filter(mm => mm !== x.ref); await persistMemoEvent(x.ev); }
        else if (CS.demo) QL.demoNotes = QL.demoNotes.filter(n => n !== x.ref);
        else { QL.notes = QL.notes.filter(n => n !== x.ref); await persistNote(x.ref, true); }
        renderNotesPage(m);
      });
    };
    draw();
    m.querySelector('#nsLog').onclick = () => openLog();
    m.querySelectorAll('[data-nst]').forEach(b => b.onclick = () => { NS.type = b.dataset.nst; renderNotesPage(m); });
    m.querySelector('#nsSrc').onchange = e => { NS.src = e.target.value; draw(); };
    m.querySelector('#nsQ').oninput = e => { NS.q = e.target.value; draw(); };
    m.querySelector('#nsDone').onchange = e => { NS.hideDone = e.target.checked; draw(); };
  }
  /* ---------- Export / import an event (Macau plan B, Rodrigo 2026-10-30) ----------
     One JSON file: the event (plan, log, results, kit), the athlete profile and the athlete's notes.
     Inside Claude the file is saved through the downloads capability; in the offline copy it is a normal download. */
  const IN_CLAUDE = typeof claude !== 'undefined' && claude && typeof claude.use === 'function';
  const slugF = s => String(s || 'event').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) || 'event';
  async function exportEvent() {
    const ev = cur();
    if (!ev) { setStatus('Choose an event first', true); return; }
    if (ev.demo) { setStatus('Demo events cannot be exported', true); return; }
    if (state.dirty) await save();
    const A = state.athletes[ev.athleteId] || null;
    loadNotes();
    const notes = QL.notes.filter(n => A && n.athleteId === A.id);
    const pack = { app: 'ON THE DOT', kind: 'event-export', v: 1, exportedAt: new Date().toISOString(), from: IN_CLAUDE ? 'claude' : 'offline', event: JSON.parse(JSON.stringify(ev)), athlete: A ? JSON.parse(JSON.stringify(A)) : null, notes: JSON.parse(JSON.stringify(notes)) };
    const filename = 'on-the-dot-' + slugF(ev.name) + '-' + localDate(new Date()) + '.json', data = JSON.stringify(pack, null, 1);
    let dl = null; if (IN_CLAUDE) { try { dl = await claude.use('downloads'); } catch (e) { dl = null; } }
    if (dl) {
      try { await dl.save({ filename, data }); setStatus('Exported ' + filename); }
      catch (e) { setStatus(e && e.code === 'declined' ? 'Export cancelled' : 'Export not available here: ' + ((e && e.message) || 'try again'), e && e.code !== 'declined'); }
      return;
    }
    try {
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000); setStatus('Exported ' + filename);
    } catch (e) { setStatus('Export failed: ' + ((e && e.message) || 'try again'), true); }
  }
  const IMP = { pack: null, err: '' };
  function importSummary(p) {
    const ev = p.event, log = ev.log || {}, sess = Object.values(log.sessions || {}).filter(s => s && (s.post || s.rpe)).length;
    return { name: ev.name || 'Event', dates: ev.dates || '', who: (p.athlete && p.athlete.name) || '', sess, memos: (log.memos || []).length, results: Object.values(ev.results || {}).filter(r => r && (r.pos || r.best)).length, notes: (p.notes || []).length, when: p.exportedAt, from: p.from };
  }
  function renderImport() {
    let el = $('#impx'); if (!el) { el = document.createElement('div'); el.id = 'impx'; el.className = 'qlog'; document.body.appendChild(el); }
    if (!IMP.pack && !IMP.err) { el.hidden = true; el.innerHTML = ''; return; }
    const p = IMP.pack, s = p ? importSummary(p) : null, mine = p ? state.events[p.event.id] : null;
    const fmtWhen = t => { try { const d = new Date(t); return fmtD(localDate(d)) + ' ' + RW.fmt(d.getHours() * 60 + d.getMinutes()); } catch (e) { return ''; } };
    el.hidden = false;
    el.innerHTML = `<div class="ql-scrim" data-impx></div><section class="ql-sheet" role="dialog" aria-modal="true" aria-labelledby="impT">
      <div class="ql-head"><h2 id="impT">Import event</h2><button class="x" data-impx aria-label="Close">${pwIco('x')}</button></div>
      ${IMP.err ? `<p class="flag">${esc(IMP.err)}</p>` : `
      <div class="imp-sum"><b>${esc(s.name)}</b><span class="hint">${esc([s.dates, s.who].filter(Boolean).join(' · '))}</span>
        <span class="hint">${[[s.sess, 'session', 'logged'], [s.results, 'result'], [s.memos, 'memo'], [s.notes, 'note']].map(([n, w, x]) => n + ' ' + w + (n === 1 ? '' : 's') + (x ? ' ' + x : '')).join(' · ')}</span>
        <span class="hint">Exported ${esc(fmtWhen(s.when))}${s.from === 'offline' ? ' from the offline copy' : ''}</span></div>
      ${mine ? `<p class="notice">This event is already here (last changed ${esc(fmtWhen(mine.updatedAt))}). Importing replaces it with the file's version${(mine.updatedAt || 0) > Date.parse(s.when) ? ', and the copy here looks <b>newer</b> than the file' : ''}.</p>` : ''}
      <p class="hint">The athlete profile is updated only if the file's version is newer. Notes are added, never removed.</p>
      <div class="ql-row"><button data-impx style="flex:1">Cancel</button><button class="primary" id="impGo" style="flex:1">${mine ? 'Replace and import' : 'Import'}</button></div>`}
    </section>`;
    el.querySelectorAll('[data-impx]').forEach(b => b.onclick = () => { IMP.pack = null; IMP.err = ''; renderImport(); });
    const go = el.querySelector('#impGo'); if (go) go.onclick = doImport;
  }
  function readImportFile(f) {
    const r = new FileReader();
    r.onload = () => {
      IMP.pack = null; IMP.err = '';
      try { const p = JSON.parse(r.result); if (!p || p.kind !== 'event-export' || !p.event || !p.event.id) throw 0; IMP.pack = p; }
      catch (e) { IMP.err = 'That file is not an ON THE DOT event export. Choose the .json file made with Export.'; }
      renderImport();
    };
    r.onerror = () => { IMP.err = 'Could not open that file.'; renderImport(); };
    r.readAsText(f);
  }
  async function doImport() {
    const p = IMP.pack; if (!p) return;
    const ev = JSON.parse(JSON.stringify(p.event)); delete ev.demo; ev.updatedAt = Date.now();
    if (CS.demo) { CS.demo = false; CS.athlete = 'all'; saveUI(); }
    try {
      if (p.athlete && p.athlete.id) {
        const L = state.athletes[p.athlete.id];
        if (!L || (p.athlete.updatedAt || 0) > (L.updatedAt || 0)) { state.athletes[p.athlete.id] = JSON.parse(JSON.stringify(p.athlete)); await saveAthleteDoc(state.athletes[p.athlete.id]); }
      }
      state.events[ev.id] = ev;
      if (state.db) await state.db.collection('events').doc(ev.id).set(JSON.parse(JSON.stringify(ev))); else localStorage.setItem(LS, JSON.stringify(realEvents()));
      loadNotes();
      const have = new Set(QL.notes.map(n => n.id));
      for (const n of (p.notes || [])) { if (!n || !n.id || have.has(n.id)) continue; QL.notes.push(n); await persistNote(n); }
      state.currentId = ev.id; state.tab = 'setup';
      if (ev.athleteId && state.athletes[ev.athleteId]) { state.focus = ev.athleteId; storeFocus(); }
      IMP.pack = null; renderImport(); setStatus('Imported ' + (ev.name || 'event')); nav('events');
    } catch (e) { IMP.err = 'Import failed: ' + ((e && e.message) || 'try again'); IMP.pack = null; renderImport(); }
  }
  /* ---------- modes ---------- */
  function setMode(mode) {
    state.mode = mode; sheet = null; if (mode !== 'day') state.scrolledNow = false;
    try { window.scrollTo(0, 0); } catch (e) {}
    try { history.replaceState(null, '', '#' + (mode === 'event' ? state.tab : mode)); } catch (e) {}
    renderMode();
  }
  function renderMode() {
    const mode = state.mode;
    renderPitwall(); renderRaceSeg();
    { const pt = $('#pgTitle'); if (pt) { pt.textContent = state.view === 'athletes' ? 'Profiles' : 'Events'; pt.hidden = state.view === 'calendar'; } }
    document.querySelectorAll('[data-bottom]').forEach(b => b.setAttribute('aria-current', b.dataset.bottom === mode ? 'page' : 'false'));
    document.body.classList.toggle('mode-track', mode !== 'event');
    const evArea = mode === 'event';
    $('#topbar').hidden = !evArea; document.querySelector('nav.tabs').hidden = !evArea || state.view === 'athletes'; $('#notice').hidden = !evArea;
    const m = $('#main');
    if (mode === 'home') renderHome(m);
    else if (mode === 'season') renderSeasonPage(m);
    else if (mode === 'notes') renderNotesPage(m);
    else if (mode === 'wellness') renderWellness(m);
    else if (mode === 'reports') renderReportsPage(m);
    else if (SOON[mode]) renderSoon(m, mode);
    else if (mode === 'today') renderToday(m);
    else if (mode === 'day') renderDay(m);
    else if (mode === 'driver') renderDriver(m);
    else {
      document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
      document.querySelector('nav.tabs').hidden = state.view !== 'events'; $('#evpick').hidden = state.view !== 'events';
      if (state.view === 'athletes') renderAthletes(); else if (state.view === 'calendar') renderCalendar(); else renderAll();
    }
  }
  setInterval(() => {
    if (state.mode === 'event' || ['home', 'season', 'notes', 'wellness'].includes(state.mode) || SOON[state.mode] || state.preview || WL.sheet) return;
    const a = document.activeElement; if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
    renderMode();
  }, 30000);

  /* ---------- events ---------- */
  function switchTab(t) { state.tab = t; state.mode = 'event'; try { history.replaceState(null, '', '#' + t); } catch (e) {} renderTabs(); renderMain(); }
  function newEvent(athleteId) { const ev = blankEvent(); if (typeof athleteId === 'string') ev.athleteId = athleteId; else if (Object.keys(state.athletes).length === 1) ev.athleteId = Object.keys(state.athletes)[0]; state.events[ev.id] = ev; state.currentId = ev.id; markDirty(); state.tab = 'setup'; renderAll(); }
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = async () => { if (state.dirty) await save(); if (state.athDirty) await saveAthlete(); setView(b.dataset.view); });
  document.querySelectorAll('nav.tabs button[data-tab]').forEach(b => b.onclick = () => switchTab(b.dataset.tab));
  document.querySelectorAll('nav.tabs .tg-l').forEach(b => b.onclick = () => { const first = Object.keys(TAB_G).find(t => TAB_G[t] === b.dataset.group); if (TAB_G[state.tab] !== b.dataset.group) switchTab(first); });
  $('#newEv').onclick = () => newEvent();
  $('#expEv').onclick = () => exportEvent();
  $('#impEv').onclick = () => { const f = $('#impFile'); f.value = ''; f.click(); };
  $('#impFile').onchange = e => { const f = e.target.files[0]; if (f) readImportFile(f); };
  $('#evSelect').onchange = async e => { if (state.dirty) await save(); state.currentId = e.target.value; renderMain(); };

  document.querySelectorAll('[data-bottom]').forEach(b => b.onclick = async () => { if (state.dirty) await save(); if (state.athDirty) await saveAthlete(); setMode(b.dataset.bottom); });
  document.querySelector('[data-scrim]').onclick = () => openDrawer(false);
  renderMode();
  initStore();
  (async () => { try { state.sample = await claude.use('sample'); } catch (e) { state.sample = null; } })();
})();
</script>
